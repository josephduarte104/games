<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #38bdf8; /* Cyan for X */
            --secondary-color: #f472b6; /* Pink for O */
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --border-radius: 16px;
            --cell-size: 100px;
            --gap: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Header & Scoreboard --- */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scoreboard {
            display: flex;
            gap: 2rem;
            background: var(--surface-color);
            padding: 1rem 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-item {
            text-align: center;
            min-width: 80px;
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        #score-x { color: var(--primary-color); }
        #score-o { color: var(--secondary-color); }
        #score-draw { color: var(--text-muted); }

        /* --- Game Board --- */
        .game-container {
            position: relative;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, var(--cell-size));
            grid-template-rows: repeat(3, var(--cell-size));
            gap: var(--gap);
        }

        .cell {
            background-color: var(--surface-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .cell:hover:not(.taken) {
            background-color: #2a3649;
            transform: translateY(-2px);
        }

        .cell.taken {
            cursor: default;
        }

        .cell.x { color: var(--primary-color); text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        .cell.o { color: var(--secondary-color); text-shadow: 0 0 15px rgba(244, 114, 182, 0.5); }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .cell span {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: block;
        }

        /* Winning Line Highlight */
        .cell.win {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* --- Status Indicator --- */
        .status {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            color: var(--text-muted);
            height: 1.5rem; /* Prevent layout shift */
            transition: color 0.3s;
        }

        /* --- Footer / Controls --- */
        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: var(--surface-color);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
            border: none;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-danger {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }

        /* --- Modal Overlay --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--surface-color);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 { margin-bottom: 1rem; font-size: 1.5rem; }
        .modal p { color: var(--text-muted); margin-bottom: 2rem; line-height: 1.5; }

        /* --- Responsive --- */
        @media (max-width: 400px) {
            :root { --cell-size: 80px; }
            .scoreboard { gap: 1rem; padding: 0.8rem 1.5rem; }
            .score-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>TIC TAC TOE</h1>
        <div class="scoreboard">
            <div class="score-item">
                <div class="score-label">Player X</div>
                <div class="score-value" id="score-x">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Draws</div>
                <div class="score-value" id="score-draw">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Player O</div>
                <div class="score-value" id="score-o">0</div>
            </div>
        </div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Cells generated by JS -->
        </div>
    </div>

    <div class="status" id="status">Player X's Turn</div>

    <div class="controls">
        <button class="btn btn-primary" id="reset-btn">Reset Board</button>
        <button class="btn btn-danger" id="quit-btn">Quit Game</button>
    </div>

    <!-- Quit Confirmation Modal -->
    <div class="modal-overlay" id="quit-modal">
        <div class="modal">
            <h2>Exit Application?</h2>
            <p>Are you sure you want to leave the game? Your current match progress will be lost.</p>
            <div class="controls" style="justify-content: center;">
                <button class="btn" id="stay-btn">Stay</button>
                <button class="btn btn-danger" id="confirm-quit-btn">Quit</button>
            </div>
        </div>
    </div>

    <script>
        /* --- Game Logic --- */
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const scoreXEl = document.getElementById('score-x');
        const scoreOEl = document.getElementById('score-o');
        const scoreDrawEl = document.getElementById('score-draw');
        const resetBtn = document.getElementById('reset-btn');
        const quitBtn = document.getElementById('quit-btn');
        
        // Modal Elements
        const quitModal = document.getElementById('quit-modal');
        const stayBtn = document.getElementById('stay-btn');
        const confirmQuitBtn = document.getElementById('confirm-quit-btn');

        let boardState = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let isGameActive = true;
        let scores = { x: 0, o: 0, draw: 0 };

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Cols
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        // Initialize Board
        function initBoard() {
            boardElement.innerHTML = '';
            boardState.forEach((cell, index) => {
                const cellElement = document.createElement('div');
                cellElement.classList.add('cell');
                cellElement.dataset.index = index;
                cellElement.addEventListener('click', handleCellClick);
                boardElement.appendChild(cellElement);
            });
        }

        // Handle Cell Click
        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.dataset.index);

            if (boardState[clickedCellIndex] !== '' || !isGameActive) {
                return;
            }

            updateCell(clickedCell, clickedCellIndex);
            checkResult();
        }

        function updateCell(cell, index) {
            boardState[index] = currentPlayer;
            cell.classList.add('taken', currentPlayer.toLowerCase());
            cell.innerHTML = `<span>${currentPlayer}</span>`;
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusElement.innerText = `Player ${currentPlayer}'s Turn`;
            statusElement.style.color = currentPlayer === 'X' ? 'var(--primary-color)' : 'var(--secondary-color)';
        }

        function checkResult() {
            let roundWon = false;
            let winningCombo = [];

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (boardState[a] === '' || boardState[b] === '' || boardState[c] === '') {
                    continue;
                }
                if (boardState[a] === boardState[b] && boardState[b] === boardState[c]) {
                    roundWon = true;
                    winningCombo = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                endGame(false, winningCombo);
                return;
            }

            if (!boardState.includes('')) {
                endGame(true);
                return;
            }

            switchPlayer();
        }

        function endGame(isDraw, winningCombo = []) {
            isGameActive = false;
            
            if (isDraw) {
                statusElement.innerText = "It's a Draw!";
                statusElement.style.color = "var(--text-muted)";
                scores.draw++;
                scoreDrawEl.innerText = scores.draw;
            } else {
                statusElement.innerText = `Player ${currentPlayer} Wins!`;
                statusElement.style.color = currentPlayer === 'X' ? 'var(--primary-color)' : 'var(--secondary-color)';
                
                // Highlight winning cells
                winningCombo.forEach(index => {
                    boardElement.children[index].classList.add('win');
                });

                if (currentPlayer === 'X') {
                    scores.x++;
                    scoreXEl.innerText = scores.x;
                } else {
                    scores.o++;
                    scoreOEl.innerText = scores.o;
                }
            }
        }

        function resetGame() {
            boardState = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            statusElement.innerText = "Player X's Turn";
            statusElement.style.color = "var(--primary-color)";
            initBoard();
        }

        /* --- Quit System --- */
        function showQuitModal() {
            quitModal.classList.add('active');
        }

        function hideQuitModal() {
            quitModal.classList.remove('active');
        }

        function quitApplication() {
            // In a real web app, we can't force close the window due to security.
            // We simulate a "Quit" by showing a final goodbye screen or redirecting.
            // Here we will clear the game and show a "Goodbye" state.
            
            hideQuitModal();
            document.body.innerHTML = `
                <div style="text-align:center; animation: fadeIn 1s;">
                    <h1 style="font-size: 3rem; margin-bottom: 1rem;">Goodbye!</h1>
                    <p style="color: var(--text-muted);">Thanks for playing.</p>
                    <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 2rem;">Play Again</button>
                </div>
            `;
            // Add fade animation style locally for this element
            const style = document.createElement('style');
            style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }`;
            document.head.appendChild(style);
        }

        /* --- Event Listeners --- */
        resetBtn.addEventListener('click', resetGame);
        quitBtn.addEventListener('click', showQuitModal);
        stayBtn.addEventListener('click', hideQuitModal);
        confirmQuitBtn.addEventListener('click', quitApplication);

        // Start
        initBoard();

    </script>
</body>
</html>
